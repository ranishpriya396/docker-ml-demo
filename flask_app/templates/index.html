<!DOCTYPE html>
<html>
<head>
    <title>Laptop Price Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Laptop Price Prediction</h1>

    <form action="/predict" method="POST">

        <input
            type="text"
            name="brand"
            placeholder="Brand"
            required>

        <input
            type="text"
            name="cpu"
            placeholder="CPU"
            required>

        <input
            type="number"
            name="ram"
            placeholder="RAM (GB)"
            required>

        <input
            type="number"
            name="storage"
            placeholder="Storage (GB)"
            required>

        <input
            type="number"
            step="0.1"
            name="screen"
            placeholder="Screen Size (Inch)"
            required>

        <input
            type="number"
            step="0.1"
            name="performance"
            placeholder="Performance Score"
            required>

        <button type="submit">
            Predict Price
        </button>

    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
